name: NFL Injury Snapshot Builder
on:
  schedule:
    # Twice daily on non-game days (6 AM and 6 PM ET = 10 AM and 10 PM UTC)
    - cron: "0 10,22 * * 2,3,5,6"
    # Hourly on game days between 9 AM - 9 PM ET (1 PM - 1 AM UTC)
    # Thursday Night Football: 9 AM - 11 PM ET
    - cron: "0 13-23 * * 4"
    # Thursday Night Football: 12 AM - 1 AM ET (for games that run late)
    - cron: "0 0-1 * * 5"
    # Sunday games: 9 AM - 11 PM ET
    - cron: "0 13-23 * * 0"
    # Sunday Night Football spillover: 12 AM - 1 AM ET Monday
    - cron: "0 0-1 * * 1"
    # Monday Night Football: 9 AM - 11 PM ET
    - cron: "0 13-23 * * 1"
    # Monday Night Football spillover: 12 AM - 1 AM ET Tuesday
    - cron: "0 0-1 * * 2"
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force complete rebuild (ignores cache)'
        required: false
        default: false
        type: boolean

jobs:
  build-injury-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    permissions:
      contents: read
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build injury snapshot
        run: node scripts/build-injuries-snapshot.js
        env:
          RAPIDAPI_NFL_KEY: ${{ secrets.RAPIDAPI_NFL_KEY }}
          NETLIFY_BLOBS_TOKEN: ${{ secrets.NETLIFY_BLOBS_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          BLOBS_STORE_NFL: nfl-data
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
          
      - name: Report status
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ Injury snapshot build completed successfully"
          else
            echo "❌ Injury snapshot build failed"
            exit 1
          fi