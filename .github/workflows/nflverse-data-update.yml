name: Update NFLverse Data

on:
  schedule:
    # Monday 7am EST (12:00 UTC)
    - cron: '0 12 * * 1'
    # Tuesday-Thursday 11am EST (16:00 UTC) 
    - cron: '0 16 * * 2,3,4'
    # Saturday 9am EST (14:00 UTC)
    - cron: '0 14 * * 6'
    # Sunday 9am EST (14:00 UTC)
    - cron: '0 14 * * 0'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        ref: main41

    - name: Set up R
      uses: r-lib/actions/setup-r@v2
      with:
        r-version: '4.3'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libcurl4-openssl-dev \
          libssl-dev \
          libxml2-dev \
          libfontconfig1-dev \
          libharfbuzz-dev \
          libfribidi-dev \
          libfreetype6-dev \
          libpng-dev \
          libtiff5-dev \
          libjpeg-dev

    - name: Cache R packages
      uses: actions/cache@v4
      with:
        path: ~/.local/share/renv
        key: ${{ runner.os }}-r-${{ hashFiles('**/renv.lock') }}
        restore-keys: |
          ${{ runner.os }}-r-

    - name: Install R dependencies
      run: |
        echo "📦 Installing R packages with improved error handling..."
        Rscript -e "
          options(repos = 'https://cran.rstudio.com/')
          
          # Install packages one by one with error handling
          packages <- c('remotes', 'jsonlite', 'glue', 'lubridate', 'dplyr', 'tidyr', 'ggplot2')
          
          for(pkg in packages) {
            if (!require(pkg, character.only = TRUE)) {
              cat('Installing:', pkg, '\n')
              install.packages(pkg, dependencies = TRUE)
              if (!require(pkg, character.only = TRUE)) {
                stop('Failed to install package: ', pkg)
              }
            }
          }
          
          # Install tidyverse last (includes many dependencies we already have)
          if (!require('tidyverse', character.only = TRUE)) {
            cat('Installing tidyverse (comprehensive)...\n')
            install.packages('tidyverse', dependencies = TRUE)
            library(tidyverse)
          }
          
          # Install NFLverse packages
          nflverse_packages <- c('nflfastR', 'nflreadr')
          for(pkg in nflverse_packages) {
            if (!require(pkg, character.only = TRUE)) {
              cat('Installing NFLverse package:', pkg, '\n')
              install.packages(pkg, dependencies = TRUE)
              library(pkg, character.only = TRUE)
            }
          }
          
          cat('✅ All R packages installed and loaded successfully\n')
          cat('tidyverse version:', as.character(packageVersion('tidyverse')), '\n')
        "

    - name: Generate repo structure
      run: |
        echo "📋 Generating repository structure map..."
        find . -type f \( -name "*.js" -o -name "*.mjs" -o -name "*.json" -o -name "*.R" -o -name "*.yml" \) | \
        grep -v node_modules | \
        grep -v .git | \
        head -200 > repo-structure.txt
        echo "Generated repo structure with $(wc -l < repo-structure.txt) files"

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install Node dependencies
      run: npm install

    - name: Run R NFLverse data pipeline
      env:
        # Let R pipeline auto-detect current week (no NFL_WEEK set = auto-detect)
        NFL_SEASON: '2025'
      run: |
        echo "🏈 Running cloud-optimized R NFLverse pipeline for Week $NFL_WEEK..."
        
        # Run the cloud-optimized R pipeline that fetches fresh data
        Rscript scripts/nfl-td-r-pipeline/cloud-pipeline.R
        
        # Convert R output for React component (copies to all locations)
        # Must run from repo root where convert_for_react.R is located
        cd $GITHUB_WORKSPACE
        Rscript convert_for_react.R
        
        # Update ESPN depth charts as backup
        node scripts/collect-espn-depth-charts.js
        
        # Optional: Validate Enhanced EPA system can read updated data
        echo "🔍 Validating Enhanced EPA system data compatibility..."
        curl -X POST "https://bgroundrobin.com/.netlify/functions/nfl-predictions-generate" \
          -H "Content-Type: application/json" \
          -d '{"season":"2025","games":[{"home_team":"KC","away_team":"ATL","game_id":"validation"}]}' \
          --max-time 30 --silent || echo "⚠️ EPA validation failed (non-blocking)"

    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        # Add all data files but exclude large .rds cache files
        git add data/*.json public/data/ src/data/ netlify/functions/_data/
        git add --force *.json *.csv # Force add any new JSON/CSV files
        
        # Exclude large cache files from commit
        git reset HEAD data/nfl_r_pipeline/*.rds 2>/dev/null || true
        
        # Only commit if there are changes
        if git diff --staged --quiet; then
          echo "No data changes to commit"
        else
          git commit -m "Auto-update NFLverse data via R pipeline - $(date +'%Y-%m-%d %H:%M UTC')"
          
          # Pull any remote changes before pushing
          echo "🔄 Pulling remote changes before push..."
          git pull origin main41 --rebase || {
            echo "⚠️ Rebase conflict detected, attempting merge strategy..."
            git pull origin main41 --no-rebase -X ours || {
              echo "❌ Cannot resolve conflicts automatically"
              git status
              exit 1
            }
          }
          
          git push origin main41
          echo "✅ Data updated and pushed"
        fi

    - name: Summary
      run: |
        echo "🎯 R NFLverse data update completed"
        echo "📅 Run time: $(date)"
        echo "🏈 Week: $NFL_WEEK"
        
    - name: Upload repo structure artifact
      uses: actions/upload-artifact@v4
      with:
        name: repo-structure
        path: repo-structure.txt
        retention-days: 30