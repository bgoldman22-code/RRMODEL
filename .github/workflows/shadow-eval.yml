name: NBA Shadow Eval

on:
  workflow_dispatch:
    inputs:
      date_start:
        description: 'Start date (YYYY-MM-DD)'
        required: true
        type: string
      date_end:
        description: 'End date (YYYY-MM-DD)'
        required: true
        type: string
      deadline:
        description: 'Trade deadline date (YYYY-MM-DD)'
        required: true
        type: string
        default: '2026-02-06'
      model_version:
        description: 'Model artifact version name'
        required: false
        type: string
        default: 'v_current'
      mode:
        description: 'Evaluation mode (margin, prob, both)'
        required: false
        type: string
        default: 'both'

jobs:
  shadow-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Snapshot current artifacts
        env:
          SHADOW_EVAL: '1'
        run: |
          node scripts/nba_shadow_eval/snapshot_artifacts.mjs \
            --version ${{ inputs.model_version }}

      - name: Run shadow evaluation
        env:
          SHADOW_EVAL: '1'
          SHADOW_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          node scripts/nba_shadow_eval/run_shadow_eval.mjs \
            --model_version ${{ inputs.model_version }} \
            --date_start ${{ inputs.date_start }} \
            --date_end ${{ inputs.date_end }} \
            --deadline ${{ inputs.deadline }} \
            --mode ${{ inputs.mode }} \
            --out ./shadow_eval/out/shadow_eval.csv

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shadow-eval-results
          path: shadow_eval/out/
          retention-days: 30

      - name: Print summary
        run: |
          echo "## 🏀 Shadow Eval Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f shadow_eval/out/shadow_eval_report.md ]; then
            cat shadow_eval/out/shadow_eval_report.md >> $GITHUB_STEP_SUMMARY
          fi
