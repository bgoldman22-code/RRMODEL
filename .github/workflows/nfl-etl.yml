# .github/workflows/nfl-player-etl.yml
# FIXED: Player data collection for TD props

name: NFL Player TD Data Collection

on:
  schedule:
    # Daily at 7 AM EST (12 PM UTC)
    - cron: '0 12 * * *'
  
  # Allow manual triggering
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL Week to predict (e.g., 4 for Week 4 predictions)'
        required: true
        default: '4'
        type: string
      season:
        description: 'NFL Season'
        required: true
        default: '2025'
        type: string

jobs:
  collect-player-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies dynamically
        run: |
          echo "Installing required dependencies..."
          npm init -y
          npm install node-fetch
          
      - name: Collect NFL Player Data
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NFL_WEEK: ${{ github.event.inputs.week || '4' }}
          NFL_SEASON: ${{ github.event.inputs.season || '2025' }}
        run: |
          echo "🏈 Starting NFL Player Data Collection"
          echo "Week: $NFL_WEEK (predicting this week)"
          echo "Season: $NFL_SEASON"
          echo "NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN && 'Present' || 'Missing' }}"
          echo "NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID && 'Present' || 'Missing' }}"
          
          if node scripts/collect-player-data.js; then
            echo "✅ NFL Player Data Collection completed successfully"
            echo "📊 Data stored in Netlify Blobs for TD predictions"
          else
            echo "❌ NFL Player Data Collection failed"
            exit 1
          fi
          
      - name: Summary
        if: always()
        run: |
          echo "## NFL Player Data Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Week**: ${{ github.event.inputs.week || '4' }} (target prediction week)" >> $GITHUB_STEP_SUMMARY
          echo "- **Season**: ${{ github.event.inputs.season || '2025' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Purpose**: Generate data for TD props predictions" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Player data ready for TD predictions" >> $GITHUB_STEP_SUMMARY
            echo "🎯 Next: Test TD systems at bgroundrobin.com" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Collection failed - check logs above" >> $GITHUB_STEP_SUMMARY
          fi
