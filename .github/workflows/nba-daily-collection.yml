name: NBA Daily Data Collection

on:
  # Schedule: Every day at 8:00 AM EST (13:00 UTC)
  schedule:
    - cron: '0 13 * * *'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  collect-nba-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main42
          fetch-depth: 1
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install Python dependencies
        run: |
          pip install requests pandas
      
      - name: Install Node.js dependencies
        run: |
          npm install
      
      - name: Check for new games
        id: check_games
        run: |
          # Get yesterday's date (games are usually finalized by 8am)
          YESTERDAY=$(date -u --date="yesterday" +%Y-%m-%d)
          TODAY=$(date -u +%Y-%m-%d)
          
          echo "Checking for games from $YESTERDAY to $TODAY"
          echo "date_yesterday=$YESTERDAY" >> $GITHUB_OUTPUT
          echo "date_today=$TODAY" >> $GITHUB_OUTPUT
      
      - name: Collect yesterday's games (Ultimate Collector)
        run: |
          python scripts/collect-nba-ultimate.py 2025-26 ${{ steps.check_games.outputs.date_yesterday }} ${{ steps.check_games.outputs.date_today }}
        continue-on-error: true
      
      - name: Calculate advanced stats (Comprehensive)
        run: |
          node scripts/collect-nba-comprehensive.js 2025-26
        continue-on-error: true
      
      - name: Commit and push data
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add all NBA data files (including injuries, games, advanced)
          git add data/nba/games/ data/nba/advanced/ data/nba/injuries/ 2>/dev/null || true
          
          # Check if there are staged changes
          if git diff --staged --quiet; then
            echo "ℹ️ No new data to commit"
          else
            git commit -m "🏀 NBA Data Update: $(date +%Y-%m-%d)"
            git push origin main42
            echo "✅ Data updated and pushed"
          fi
      
      - name: Trigger Netlify rebuild (optional)
        if: success()
        run: |
          # If you want to trigger a Netlify rebuild after data collection
          # Uncomment and add your Netlify build hook URL as a secret
          # curl -X POST -d {} ${{ secrets.NETLIFY_BUILD_HOOK }}
          echo "Netlify rebuild can be triggered here"
      
      - name: Send notification on failure
        if: failure()
        run: |
          echo "❌ NBA data collection failed on $(date)"
          # Add notification logic here (email, Slack, etc.)
