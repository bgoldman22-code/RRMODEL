name: "NBA Props Phase 3.5 Daily Pipeline [DISABLED - see nba-props-v2-daily.yml]"

# DISABLED: Consolidated into nba-props-v2-daily.yml which runs 2x/day (8am + 3:30pm ET)
# Keeping file for reference. Do not re-enable.
on:
  # schedule:
  #   - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      skip_fetch:
        description: 'Skip fetching new boxscores (test mode)'
        required: false
        default: 'false'

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install Node dependencies
        run: npm ci
      
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install lightgbm>=4.0.0
          pip install -r requirements-phase3.txt
          pip install -r requirements-nba.txt
      
      - name: Fetch latest boxscores
        if: github.event.inputs.skip_fetch != 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          echo "📦 Fetching NBA boxscores (last 3 days)..."
          node scripts/nba/fetch-player-boxscores-2025-26.mjs --daily
      
      - name: Merge boxscores into canonical history
        run: |
          echo "🔄 Merging boxscores into canonical dataset..."
          node scripts/nba/merge-boxscores-history.mjs
      
      - name: Generate predictions
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          echo "🎯 Generating predictions with Phase 3.5 system..."
          node scripts/nba/generate-predictions-phase3.5.mjs
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add all modified data files FIRST (force-add to bypass .gitignore)
          git add -f data/nba/player-boxscores-2025-26.json
          git add -f data/nba/player-history-2024-2026.json
          git add public/data/nba/nba-props-v2-live.json
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "✅ No changes to commit"
          else
            # Stash any remaining unstaged changes so pull --rebase works
            git stash --include-untracked || true
            
            # Pull latest changes to avoid conflicts
            echo "🔄 Pulling latest remote changes..."
            git pull --rebase origin ${{ github.ref_name }} || {
              echo "⚠️ Rebase pull failed, trying merge..."
              git rebase --abort 2>/dev/null || true
              git pull origin ${{ github.ref_name }} --no-rebase
            }
            
            # Restore stashed changes
            git stash pop || true
            
            # Re-add files (in case pull modified them)
            git add -f data/nba/player-boxscores-2025-26.json
            git add -f data/nba/player-history-2024-2026.json
            git add public/data/nba/nba-props-v2-live.json
            
            COMMIT_MSG="chore: automated NBA props update"$'\n\n'"- Fetch latest boxscores"$'\n'"- Merge into canonical history"$'\n'"- Generate predictions with Phase 3.5 system"$'\n\n'"Generated by workflow run: ${{ github.run_id }}"
            git commit -m "$COMMIT_MSG"
            
            # Push with retry logic
            echo "⬆️ Pushing changes..."
            MAX_RETRIES=3
            RETRY_COUNT=0
            until git push origin ${{ github.ref_name }}; do
              RETRY_COUNT=$((RETRY_COUNT+1))
              if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
                echo "❌ Failed to push after $MAX_RETRIES attempts"
                exit 1
              fi
              echo "⚠️ Push failed, retrying ($RETRY_COUNT/$MAX_RETRIES)..."
              sleep 5
              git stash --include-untracked || true
              git pull --rebase origin ${{ github.ref_name }} || git pull origin ${{ github.ref_name }} --no-rebase
              git stash pop || true
            done
            echo "✅ Successfully pushed changes"
          fi
      
      - name: Summary
        if: always()
        run: |
          echo "### Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID**: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f public/data/nba/nba-props-v2-live.json ]; then
            PICK_COUNT=$(jq '.picks | length' public/data/nba/nba-props-v2-live.json)
            echo "✅ Generated $PICK_COUNT picks" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ No predictions file generated" >> $GITHUB_STEP_SUMMARY
          fi
