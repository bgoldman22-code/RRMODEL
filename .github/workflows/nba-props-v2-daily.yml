name: NBA Props Phase 3.5 (2x Daily)

on:
  # Run daily at 8:00 AM ET (12:00 UTC) and 3:30 PM ET (19:30 UTC)
  schedule:
    - cron: '0 12 * * *'
    - cron: '30 19 * * *'
  
  # Run when pushed to main42 (so it runs TODAY when you push this)
  push:
    branches:
      - main42
    paths:
      - '.github/workflows/nba-props-v2-daily.yml'
      - 'scripts/nba/generate-predictions-phase3.5.mjs'
      - 'scripts/nba/fetch-player-boxscores-2025-26.mjs'
      - 'scripts/nba/merge-boxscores-history.mjs'
  
  # Allow manual trigger from GitHub Actions UI
  workflow_dispatch:

# Prevent concurrent runs
concurrency:
  group: nba-props-v2-update
  cancel-in-progress: false

jobs:
  update-phase35-predictions:
    name: Update NBA Props (Phase 3.5)
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install Node dependencies
        run: npm ci
      
      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install lightgbm>=4.0.0
          pip install -r requirements-phase3.txt 2>/dev/null || true
          pip install -r requirements-nba.txt 2>/dev/null || true
      
      - name: 📊 Fetch latest boxscores (last 3 days)
        run: |
          echo "Fetching recent boxscores..."
          node scripts/nba/fetch-player-boxscores-2025-26.mjs --daily
          echo "Boxscores updated ✓"
      
      - name: 🔄 Merge boxscores into canonical history
        run: |
          echo "Merging boxscores into canonical dataset..."
          node scripts/nba/merge-boxscores-history.mjs
          echo "History merged ✓"
      
      - name: 🎯 Generate Phase 3.5 predictions
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          echo "Generating Phase 3.5 predictions (Logistic + LightGBM)..."
          node scripts/nba/generate-predictions-phase3.5.mjs
          echo "Predictions generated ✓"
      
      - name: 📝 Commit and push changes
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          # Save our generated files to temp (these are the source of truth)
          cp data/nba/player-boxscores-2025-26.json /tmp/boxscores-backup.json
          cp data/nba/player-history-2024-2026.json /tmp/history-backup.json
          cp public/data/nba/nba-props-v2-live.json /tmp/props-backup.json
          
          MAX_RETRIES=3
          RETRY_COUNT=0
          
          while true; do
            # Pull latest (discard any local conflicts on data files)
            git checkout -- data/nba/player-boxscores-2025-26.json data/nba/player-history-2024-2026.json public/data/nba/nba-props-v2-live.json 2>/dev/null || true
            git pull origin ${{ github.ref_name }} --no-rebase || true
            
            # Restore our generated files (overwrite whatever remote had)
            cp /tmp/boxscores-backup.json data/nba/player-boxscores-2025-26.json
            cp /tmp/history-backup.json data/nba/player-history-2024-2026.json
            cp /tmp/props-backup.json public/data/nba/nba-props-v2-live.json
            
            # Stage and commit
            git add -f data/nba/player-boxscores-2025-26.json
            git add -f data/nba/player-history-2024-2026.json
            git add public/data/nba/nba-props-v2-live.json
            
            if git diff --staged --quiet; then
              echo "✅ No changes to commit"
              break
            fi
            
            git commit -m "🤖 NBA Props Phase 3.5 update - $(date -u +%Y-%m-%d\ %H:%M)"
            
            if git push origin ${{ github.ref_name }}; then
              echo "✅ Successfully pushed changes"
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT+1))
            if [ $RETRY_COUNT -ge $MAX_RETRIES ]; then
              echo "❌ Failed to push after $MAX_RETRIES attempts"
              exit 1
            fi
            echo "⚠️ Push failed, retrying ($RETRY_COUNT/$MAX_RETRIES)..."
            sleep 5
            git reset HEAD~1  # undo commit so we can re-pull
          done
