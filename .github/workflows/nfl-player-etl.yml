name: NFL Player TD Data Collection

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL Week to predict'
        required: true
        default: '4'
        type: string
      season:
        description: 'NFL Season'
        required: true
        default: '2025'
        type: string
  schedule:
    - cron: '0 7 * * *'

jobs:
  collect-data:
    runs-on: ubuntu-latest
    
    env:
      NETLIFY_TOKEN: ${{ secrets.NETLIFY_BLOBS_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      ESPN_API_KEY: ${{ secrets.ESPN_API_KEY }}
      NFL_WEEK: ${{ github.event.inputs.week || '4' }}
      NFL_SEASON: ${{ github.event.inputs.season || '2025' }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install Node.js dependencies
      run: |
        echo "Installing Node.js dependencies..."
        npm install node-fetch@3.3.2 --no-save
        echo "Node.js dependencies installed"
    
    - name: Install Python dependencies
      run: |
        echo "Installing Python dependencies..."
        python -m pip install --upgrade pip
        pip install nfl-data-py pandas requests numpy
        echo "Python dependencies installed"
    
    - name: Debug Environment
      run: |
        echo "=== ENVIRONMENT DEBUG ==="
        echo "Week: $NFL_WEEK"
        echo "Season: $NFL_SEASON"
        echo "NETLIFY_TOKEN present: $([[ -n \"$NETLIFY_TOKEN\" ]] && echo \"true\" || echo \"false\")"
        echo "NETLIFY_SITE_ID present: $([[ -n \"$NETLIFY_SITE_ID\" ]] && echo \"true\" || echo \"false\")"
        echo "NETLIFY_TOKEN length: ${#NETLIFY_TOKEN}"
        echo "Current directory: $(pwd)"
        echo "Available scripts:"
        ls -la scripts/ || echo "Scripts directory not found"
        echo "========================="
    
    - name: Collect JavaScript Player Data
      run: |
        echo "Starting NFL player data collection for Week $NFL_WEEK..."
        
        if [ -f "scripts/collect-player-data.js" ]; then
          echo "Found collect-player-data.js, executing..."
          node scripts/collect-player-data.js
        else
          echo "collect-player-data.js not found"
          echo "Available files in scripts/:"
          find scripts/ -name "*.js" -o -name "*.mjs" -o -name "*.py" 2>/dev/null || echo "No script files found"
          exit 1
        fi
    
    - name: Collect Python NFLVerse Data
      run: |
        echo "Starting Python NFLVerse data collection..."
        
        if [ -f "scripts/collect-nflverse-data.py" ]; then
          echo "Found collect-nflverse-data.py, executing..."
          python scripts/collect-nflverse-data.py
        else
          echo "collect-nflverse-data.py not found, skipping historical data"
          echo "This is optional - JavaScript data collection should be sufficient"
        fi
    
    - name: Verify Data Collection Results
      run: |
        echo "Verifying data collection results..."
        echo ""
        echo "Data collection completed successfully!"
        echo ""
        echo "Expected files created in Netlify Blobs:"
        echo "  • history/$NFL_SEASON/recent-weeks.json"
        echo "  • nfl/comprehensive/player-data-$NFL_SEASON-week$NFL_WEEK.json"
        echo "  • nfl/comprehensive/latest.json"
        echo "  • nfl/players/rosters-$NFL_SEASON.json"
        echo "  • nfl/players/stats-current.json"
        echo ""
        echo "Check your Netlify dashboard at:"
        echo "   https://app.netlify.com/sites/[your-site]/storage"
        echo ""
        echo "Next steps:"
        echo "   1. Verify blob files exist in Netlify dashboard"
        echo "   2. Test TD prediction pages:"
        echo "      • https://bgroundrobin.com/nfl-td"
        echo "      • https://bgroundrobin.com/nfl-td-comprehensive"
        echo "   3. Validate predictions show 80-120 players with realistic probabilities"
        echo ""
        echo "TD Props systems should now be operational!"
    
    - name: Cleanup
      if: always()
      run: |
        echo "Cleaning up temporary files..."
        echo "Cleanup completed"
