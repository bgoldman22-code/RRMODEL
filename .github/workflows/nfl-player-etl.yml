name: NFL Player TD Data Collection

on:
  schedule:
    - cron: '0 12 * * *'  # Daily at 7 AM EST (12 PM UTC)
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL Week to predict (e.g., 4 for Week 4 predictions)'
        required: false
        default: '4'
        type: string
      season:
        description: 'NFL Season'
        required: false
        default: '2025'
        type: string

jobs:
  collect-player-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install dependencies dynamically
        run: |
          echo "Installing required dependencies..."
          npm init -y
          npm install node-fetch
          
      - name: Setup Python for NFLVerse
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install Python dependencies
        run: |
          echo "Installing Python dependencies..."
          pip install nfl-data-py pandas requests
          
      - name: Collect NFL Player Data (JavaScript)
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_BLOBS_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NFL_WEEK: ${{ github.event.inputs.week || '4' }}
          NFL_SEASON: ${{ github.event.inputs.season || '2025' }}
        run: |
          echo "🏈 Collecting NFL Player Data for Week $NFL_WEEK, Season $NFL_SEASON"
          echo "Environment Check:"
          echo "NETLIFY_TOKEN: ${NETLIFY_TOKEN:+Present}"
          echo "NETLIFY_SITE_ID: ${NETLIFY_SITE_ID:+Present}"
          echo "NFL_WEEK: $NFL_WEEK"
          echo "NFL_SEASON: $NFL_SEASON"
          
          node scripts/collect-player-data.js
          
      - name: Collect NFLVerse Historical Data (Python)
        env:
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_BLOBS_TOKEN}}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NFL_WEEK: ${{ github.event.inputs.week || '4' }}
          NFL_SEASON: ${{ github.event.inputs.season || '2025' }}
        run: |
          echo "📊 Collecting NFLVerse historical data..."
          python scripts/collect-nflverse-data.py || echo "⚠️ NFLVerse collection failed - continuing with JavaScript data only"
          
      - name: Summary
        run: |
          echo "✅ NFL Player TD Data Collection completed"
          echo "📈 Week ${{ github.event.inputs.week || '4' }} prediction data ready"
          echo "🎯 Both TD prediction systems should now have data"
