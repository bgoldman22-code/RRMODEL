name: MLB V3 Statcast Daily

on:
  schedule:
    - cron: '0 12 * * *'   # 7 AM ET (12:00 UTC)
  workflow_dispatch:
    inputs:
      year:
        description: 'Current season year (leave blank for calendar year)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run — fetch only, no upload to Blobs'
        required: false
        default: 'false'
      scope:
        description: 'Which years to fetch: both (default), prior-only, current-only'
        required: false
        default: 'both'
      date:
        description: 'Override date for feature vector build (YYYY-MM-DD, default: today)'
        required: false
        default: ''
      skip_features:
        description: 'Skip daily feature vector build (Statcast refresh only)'
        required: false
        default: 'false'

concurrency:
  group: mlb-statcast-daily
  cancel-in-progress: true

jobs:
  fetch-statcast:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main42

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-statcast-v2-${{ hashFiles('scripts/mlb_v3/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-statcast-v2-
            ${{ runner.os }}-pip-statcast-

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pandas requests pybaseball numpy scikit-learn xgboost joblib

      # ── Step 1: Fetch all 6 Statcast / FanGraphs datasets ──────────────────
      - name: Fetch Statcast data → upload to Netlify Blobs
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          CMD="python scripts/mlb_v3/fetch_statcast.py"
          YEAR="${{ github.event.inputs.year }}"
          DRY="${{ github.event.inputs.dry_run }}"
          SCOPE="${{ github.event.inputs.scope }}"
          if [ -n "$YEAR" ]; then CMD="$CMD --year $YEAR"; fi
          if [ "$DRY" = "true" ]; then CMD="$CMD --dry-run"; fi
          if [ "$SCOPE" = "prior-only" ]; then CMD="$CMD --prior-only"
          elif [ "$SCOPE" = "current-only" ]; then CMD="$CMD --current-only"; fi
          echo "Running: $CMD"
          eval "$CMD"

      # ── Step 2: Validate Blobs row counts ──────────────────────────────────
      - name: Validate — read back Blobs and print row counts
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: python scripts/mlb_v3/validate_blobs.py

      # ── Step 3: Build today's per-player feature vectors ───────────────────
      # Runs after Statcast blobs are confirmed written. Writes
      # statcast/features-{YYYY-MM-DD}.json to rrmodelblobs.
      # The Netlify function reads this blob at request time and runs
      # XGBoost inference. If this step fails the function falls back to V2.
      - name: Build daily feature vectors → upload to Netlify Blobs
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.skip_features != 'true' }}
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          CMD="python scripts/mlb_v3/build_daily_features.py"
          DATE_OVERRIDE="${{ github.event.inputs.date }}"
          YEAR="${{ github.event.inputs.year }}"
          if [ -n "$DATE_OVERRIDE" ]; then CMD="$CMD --date $DATE_OVERRIDE"; fi
          if [ -n "$YEAR" ]; then CMD="$CMD --year $YEAR"; fi
          echo "Running: $CMD"
          eval "$CMD"
        # Non-fatal: feature build failure is logged but doesn't fail the pipeline.
        # The JS function detects the missing blob and falls back gracefully.
        continue-on-error: true

      # ── Step 4: Commit feature vectors back to repo ─────────────────────────
      # pull FIRST (before any staged files exist), then add, then push.
      # This avoids the "cannot pull with rebase: You have unstaged changes" error.
      - name: Commit and push feature vectors
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.skip_features != 'true' }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git pull --ff-only origin main42
          mkdir -p public/mlb_v3
          # prune files older than 7 days so the repo doesn't bloat
          find public/mlb_v3/ -name 'features-*.json' -mtime +7 -delete 2>/dev/null || true
          git add public/mlb_v3/
          git diff --staged --quiet || git commit -m "chore: daily MLB feature vectors $(date -u +%Y-%m-%d) [skip ci]"
          git push origin main42
