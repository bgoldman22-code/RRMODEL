<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Predictions Elite - bGround Robin</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            color: #00ff88;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 255, 136, 0.3);
        }

        .subtitle {
            color: #888;
            font-size: 1.1em;
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .week-selector {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1a1f3a;
            padding: 12px 20px;
            border-radius: 8px;
            border: 1px solid #2a2f4a;
        }

        .week-selector label {
            color: #888;
            font-size: 14px;
            text-transform: uppercase;
        }

        .week-selector select {
            background: #0a0e27;
            color: #fff;
            border: 1px solid #00ff88;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            outline: none;
        }

        .btn {
            background: #00ff88;
            color: #0a0e27;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #00cc6e;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.3);
        }

        .btn:disabled {
            background: #444;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #2a2f4a;
            color: #fff;
        }

        .btn-secondary:hover {
            background: #3a3f5a;
        }

        .status {
            text-align: center;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: 500;
        }

        .status.loading {
            background: #2a2f4a;
            color: #ffa500;
        }

        .status.success {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            border: 1px solid #00ff88;
        }

        .status.error {
            background: rgba(255, 68, 68, 0.1);
            color: #ff4444;
            border: 1px solid #ff4444;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #1a1f3a 0%, #2a2f4a 100%);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid #2a2f4a;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #00ff88;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #888;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .predictions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .game-card {
            background: #1a1f3a;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #2a2f4a;
            transition: all 0.3s ease;
            position: relative;
        }

        .game-card:hover {
            border-color: #00ff88;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.2);
            transform: translateY(-2px);
        }

        .confidence-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .confidence-HIGH {
            background: #00ff88;
            color: #0a0e27;
        }

        .confidence-MEDIUM {
            background: #ffa500;
            color: #0a0e27;
        }

        .confidence-LOW {
            background: #ff4444;
            color: #fff;
        }

        .matchup {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            padding-right: 100px;
            line-height: 1.3;
        }

        .pick-section {
            background: rgba(0, 255, 136, 0.1);
            border-left: 3px solid #00ff88;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .pick-label {
            color: #888;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .pick-value {
            font-size: 1.4em;
            font-weight: bold;
            color: #00ff88;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: #0f1629;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
        }

        .stat-box-label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .stat-box-value {
            font-size: 1.3em;
            font-weight: bold;
            color: #fff;
        }

        .edge-positive {
            color: #00ff88;
        }

        .edge-negative {
            color: #ff4444;
        }

        .team-comparison {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2a2f4a;
        }

        .team-stats {
            background: #0f1629;
            padding: 12px;
            border-radius: 6px;
        }

        .team-name {
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .team-stat-line {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }

        .team-stat-line span:last-child {
            color: #fff;
            font-weight: 600;
        }

        .odds-info {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2a2f4a;
        }

        .odds-item {
            text-align: center;
        }

        .odds-label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .odds-value {
            font-weight: 600;
            color: #fff;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-size: 1.2em;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #2a2f4a;
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            color: #666;
            padding: 30px 20px;
            border-top: 1px solid #2a2f4a;
            margin-top: 40px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .predictions-grid {
                grid-template-columns: 1fr;
            }

            .summary-stats {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* PNG Export Overlay */
        #exportOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 14, 39, 0.95);
            z-index: 9999;
            overflow: auto;
        }

        #exportContent {
            max-width: 1200px;
            margin: 40px auto;
            padding: 40px;
            background: #0a0e27;
        }

        .export-header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #00ff88;
        }

        .export-title {
            font-size: 2em;
            color: #00ff88;
            margin-bottom: 10px;
        }

        .export-subtitle {
            color: #888;
        }

        .close-export {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ff4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            z-index: 10000;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏈 NFL Predictions Elite</h1>
            <div class="subtitle">
                Powered by NFLVerse EPA • Live Team Form • Advanced Modeling
            </div>
        </header>

        <div class="controls">
            <div class="week-selector">
                <label for="weekSelect">Week:</label>
                <select id="weekSelect">
                    <option value="1">Week 1</option>
                    <option value="2">Week 2</option>
                    <option value="3">Week 3</option>
                    <option value="4">Week 4</option>
                    <option value="5">Week 5</option>
                    <option value="6">Week 6</option>
                    <option value="7">Week 7</option>
                    <option value="8">Week 8</option>
                    <option value="9">Week 9</option>
                    <option value="10">Week 10</option>
                    <option value="11">Week 11</option>
                    <option value="12">Week 12</option>
                    <option value="13">Week 13</option>
                    <option value="14">Week 14</option>
                    <option value="15">Week 15</option>
                    <option value="16">Week 16</option>
                    <option value="17">Week 17</option>
                    <option value="18">Week 18</option>
                </select>
            </div>
            <button class="btn" onclick="loadPredictions()" id="btnRefresh">
                ⟳ Refresh
            </button>
            <button class="btn btn-secondary" onclick="exportToPNG()" id="btnExport">
                📸 Export PNG
            </button>
        </div>

        <div id="status" class="status" style="display: none;"></div>

        <div id="summaryStats" class="summary-stats" style="display: none;"></div>

        <div id="predictions" class="predictions-grid">
            <div class="no-data">
                <div class="loading-spinner"></div>
                <div style="margin-top: 15px;">Loading predictions...</div>
            </div>
        </div>

        <footer>
            <p>⚠️ For entertainment and educational purposes only. Gamble responsibly.</p>
            <p style="margin-top: 10px; color: #444;">bGround Robin © 2025</p>
        </footer>
    </div>

    <!-- PNG Export Overlay -->
    <div id="exportOverlay">
        <button class="close-export" onclick="closeExport()">✕ Close</button>
        <div id="exportContent">
            <div class="export-header">
                <div class="export-title">🏈 NFL Predictions Elite</div>
                <div class="export-subtitle" id="exportWeek"></div>
            </div>
            <div id="exportGames"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script>
        let currentData = null;
        let currentWeek = 3;

        // Initialize
        window.addEventListener('load', () => {
            // Get current NFL week (approximate - week 1 starts ~Sep 5)
            const now = new Date();
            const year = now.getFullYear();
            const seasonStart = new Date(year, 8, 5); // September 5
            const weeksSinceStart = Math.floor((now - seasonStart) / (7 * 24 * 60 * 60 * 1000));
            currentWeek = Math.max(1, Math.min(18, weeksSinceStart + 1));
            
            document.getElementById('weekSelect').value = currentWeek;
            loadPredictions();
        });

        async function loadPredictions() {
            try {
                currentWeek = document.getElementById('weekSelect').value;
                const btnRefresh = document.getElementById('btnRefresh');
                btnRefresh.disabled = true;
                btnRefresh.textContent = '⟳ Loading...';
                
                setStatus('Loading predictions...', 'loading');
                
                const season = new Date().getFullYear();
                const response = await fetch(`/.netlify/functions/nfl-predictions-generate2?week=${currentWeek}&season=${season}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                currentData = data;
                renderPredictions(data);
                setStatus(`✅ Loaded ${data.rows?.length || 0} games for Week ${currentWeek}`, 'success');
                
                setTimeout(() => {
                    document.getElementById('status').style.display = 'none';
                }, 3000);
                
            } catch (error) {
                console.error('Load Error:', error);
                setStatus(`❌ Error: ${error.message}`, 'error');
                document.getElementById('predictions').innerHTML = `
                    <div class="no-data">
                        <div style="color: #ff4444; font-size: 1.5em; margin-bottom: 10px;">⚠️</div>
                        <div>Failed to load predictions</div>
                        <div style="margin-top: 10px; font-size: 0.9em; color: #666;">${error.message}</div>
                    </div>
                `;
            } finally {
                const btnRefresh = document.getElementById('btnRefresh');
                btnRefresh.disabled = false;
                btnRefresh.textContent = '⟳ Refresh';
            }
        }

        function setStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type}`;
            status.style.display = 'block';
        }

        function renderPredictions(data) {
            const rows = data.rows || [];
            
            if (rows.length === 0) {
                document.getElementById('predictions').innerHTML = `
                    <div class="no-data">No games available for Week ${currentWeek}</div>
                `;
                document.getElementById('summaryStats').style.display = 'none';
                return;
            }

            // Render summary stats
            const highConfidence = rows.filter(r => r.confidence === 'HIGH').length;
            const mediumConfidence = rows.filter(r => r.confidence === 'MEDIUM').length;
            const avgEdge = rows.reduce((sum, r) => sum + (r.modelEdge || 0), 0) / rows.length;
            const topPicks = rows.filter(r => r.modelEdge > 0.05).length;

            document.getElementById('summaryStats').innerHTML = `
                <div class="stat-card">
                    <div class="stat-value">${rows.length}</div>
                    <div class="stat-label">Total Games</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${highConfidence}</div>
                    <div class="stat-label">High Confidence</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${topPicks}</div>
                    <div class="stat-label">Top Picks (5%+ Edge)</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">${(avgEdge * 100).toFixed(1)}%</div>
                    <div class="stat-label">Avg Model Edge</div>
                </div>
            `;
            document.getElementById('summaryStats').style.display = 'grid';

            // Render game cards
            const html = rows.map(game => renderGameCard(game)).join('');
            document.getElementById('predictions').innerHTML = html;
        }

        function renderGameCard(game) {
            const homeTeam = game.matchup.split(' @ ')[1];
            const awayTeam = game.matchup.split(' @ ')[0];
            
            const confidenceClass = `confidence-${game.confidence || 'LOW'}`;
            const edgeClass = game.modelEdge > 0 ? 'edge-positive' : 'edge-negative';
            
            const homeWinProb = (game.homeProb * 100).toFixed(1);
            const awayWinProb = (game.awayProb * 100).toFixed(1);
            
            const isPick = game.pick === homeTeam ? 'Home' : 'Away';
            const pickProb = (game.modelPickProb * 100).toFixed(1);
            
            const homeML = game.ml_home > 0 ? `+${game.ml_home}` : game.ml_home;
            const awayML = game.ml_away > 0 ? `+${game.ml_away}` : game.ml_away;
            
            const marketProb = game.marketProb ? (game.marketProb * 100).toFixed(1) + '%' : 'N/A';
            const modelEdge = game.modelEdge ? (game.modelEdge * 100).toFixed(1) + '%' : 'N/A';
            
            return `
                <div class="game-card">
                    <div class="confidence-badge ${confidenceClass}">
                        ${game.confidence || 'LOW'}
                    </div>
                    
                    <div class="matchup">${game.matchup}</div>
                    
                    <div class="pick-section">
                        <div class="pick-label">Model Pick</div>
                        <div class="pick-value">${game.pick} (${pickProb}%)</div>
                    </div>
                    
                    <div class="stats-row">
                        <div class="stat-box">
                            <div class="stat-box-label">Home Win</div>
                            <div class="stat-box-value">${homeWinProb}%</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-box-label">Away Win</div>
                            <div class="stat-box-value">${awayWinProb}%</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-box-label">Model Edge</div>
                            <div class="stat-box-value ${edgeClass}">${modelEdge}</div>
                        </div>
                    </div>
                    
                    <div class="team-comparison">
                        <div class="team-stats">
                            <div class="team-name">${awayTeam} (Away)</div>
                            <div class="team-stat-line">
                                <span>EPA/Play:</span>
                                <span>${game.teamStats?.away?.epa?.toFixed(3) || 'N/A'}</span>
                            </div>
                            <div class="team-stat-line">
                                <span>Form:</span>
                                <span>${game.teamStats?.away?.form?.toFixed(3) || 'N/A'}</span>
                            </div>
                            <div class="team-stat-line">
                                <span>Strength:</span>
                                <span>${game.teamStats?.away?.strength?.toFixed(3) || 'N/A'}</span>
                            </div>
                        </div>
                        <div class="team-stats">
                            <div class="team-name">${homeTeam} (Home)</div>
                            <div class="team-stat-line">
                                <span>EPA/Play:</span>
                                <span>${game.teamStats?.home?.epa?.toFixed(3) || 'N/A'}</span>
                            </div>
                            <div class="team-stat-line">
                                <span>Form:</span>
                                <span>${game.teamStats?.home?.form?.toFixed(3) || 'N/A'}</span>
                            </div>
                            <div class="team-stat-line">
                                <span>Strength:</span>
                                <span>${game.teamStats?.home?.strength?.toFixed(3) || 'N/A'}</span>
                            </div>
                        </div>
                    </div>
                    
                    ${game.ml_home && game.ml_away ? `
                        <div class="odds-info">
                            <div class="odds-item">
                                <div class="odds-label">Home ML</div>
                                <div class="odds-value">${homeML}</div>
                            </div>
                            <div class="odds-item">
                                <div class="odds-label">Away ML</div>
                                <div class="odds-value">${awayML}</div>
                            </div>
                            <div class="odds-item">
                                <div class="odds-label">Market Prob</div>
                                <div class="odds-value">${marketProb}</div>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        async function exportToPNG() {
            if (!currentData || !currentData.rows || currentData.rows.length === 0) {
                alert('No predictions to export. Please load predictions first.');
                return;
            }

            const btnExport = document.getElementById('btnExport');
            btnExport.disabled = true;
            btnExport.textContent = '📸 Generating...';

            try {
                // Show overlay with export content
                document.getElementById('exportWeek').textContent = `Week ${currentWeek} - ${new Date().toLocaleDateString()}`;
                
                // Render top 10 games for export
                const topGames = currentData.rows.slice(0, 10);
                const exportGamesHtml = topGames.map(game => renderGameCard(game)).join('');
                document.getElementById('exportGames').innerHTML = `
                    <div class="predictions-grid">${exportGamesHtml}</div>
                `;
                
                document.getElementById('exportOverlay').style.display = 'block';
                
                // Wait for render
                await new Promise(resolve => setTimeout(resolve, 500));
                
                // Capture PNG
                const canvas = await html2canvas(document.getElementById('exportContent'), {
                    backgroundColor: '#0a0e27',
                    scale: 2,
                    logging: false
                });
                
                // Download
                const link = document.createElement('a');
                link.download = `nfl-predictions-week-${currentWeek}-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
                
                setStatus('✅ PNG exported successfully!', 'success');
                setTimeout(() => {
                    document.getElementById('status').style.display = 'none';
                }, 3000);
                
            } catch (error) {
                console.error('Export Error:', error);
                setStatus(`❌ Export failed: ${error.message}`, 'error');
            } finally {
                btnExport.disabled = false;
                btnExport.textContent = '📸 Export PNG';
                closeExport();
            }
        }

        function closeExport() {
            document.getElementById('exportOverlay').style.display = 'none';
        }

        // Helper functions
        function americanToImplied(odds) {
            if (odds > 0) return 100 / (odds + 100);
            return Math.abs(odds) / (Math.abs(odds) + 100);
        }
    </script>
</body>
</html>
