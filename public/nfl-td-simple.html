<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NFL Anytime TD Odds - Simple View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #1e40af;
            font-size: 32px;
            margin-bottom: 10px;
        }
        
        .header .subtitle {
            color: #64748b;
            font-size: 16px;
        }
        
        .stats-bar {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
        }
        
        .stat {
            flex: 1;
            min-width: 200px;
        }
        
        .stat-label {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 5px;
        }
        
        .stat-value {
            color: #1e40af;
            font-size: 28px;
            font-weight: bold;
        }
        
        .loading {
            background: white;
            padding: 60px;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
            color: #64748b;
        }
        
        .error {
            background: #fee;
            border: 2px solid #f88;
            padding: 20px;
            border-radius: 12px;
            color: #c00;
            margin-bottom: 20px;
        }
        
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: #1e40af;
            color: white;
        }
        
        th {
            padding: 16px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        th.center, td.center {
            text-align: center;
        }
        
        tbody tr {
            border-bottom: 1px solid #e2e8f0;
            transition: background-color 0.2s;
        }
        
        tbody tr:hover {
            background: #f8fafc;
        }
        
        tbody tr:last-child {
            border-bottom: none;
        }
        
        td {
            padding: 16px;
            font-size: 14px;
        }
        
        .player-name {
            font-weight: 600;
            color: #1e293b;
            font-size: 15px;
        }
        
        .game-info {
            color: #64748b;
            font-size: 13px;
            margin-top: 4px;
        }
        
        .odds-good {
            color: #059669;
            font-weight: 700;
            font-size: 16px;
        }
        
        .odds-bad {
            color: #dc2626;
            font-weight: 700;
            font-size: 16px;
        }
        
        .books-badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e40af;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 12px;
        }
        
        .prob-high {
            color: #059669;
            font-weight: 700;
        }
        
        .prob-medium {
            color: #d97706;
            font-weight: 600;
        }
        
        .prob-low {
            color: #64748b;
            font-weight: 500;
        }
        
        .action-bet {
            background: #10b981;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
        }
        
        .action-watch {
            background: #f59e0b;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
        }
        
        .action-pass {
            background: #64748b;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 13px;
        }
        
        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #10b981;
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            transition: all 0.3s;
        }
        
        .refresh-btn:hover {
            background: #059669;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(16, 185, 129, 0.5);
        }
        
        .timestamp {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏈 NFL Anytime TD Odds</h1>
            <div class="subtitle">Real-time odds from DraftKings, FanDuel, and BetMGM</div>
            <div class="timestamp" id="timestamp"></div>
        </div>
        
        <div class="stats-bar" id="stats" style="display: none;">
            <div class="stat">
                <div class="stat-label">Total Players</div>
                <div class="stat-value" id="totalPlayers">-</div>
            </div>
            <div class="stat">
                <div class="stat-label">Games Today</div>
                <div class="stat-value" id="gamesCount">-</div>
            </div>
            <div class="stat">
                <div class="stat-label">Strong Bets</div>
                <div class="stat-value" id="strongBets">-</div>
            </div>
        </div>
        
        <div id="error" class="error" style="display: none;"></div>
        <div id="loading" class="loading">🏈 Loading TD odds...</div>
        
        <div class="table-container" id="tableContainer" style="display: none;">
            <table>
                <thead>
                    <tr>
                        <th>Player</th>
                        <th>Game</th>
                        <th class="center">Best Odds</th>
                        <th class="center">Books</th>
                        <th class="center">Implied %</th>
                        <th class="center sortable" onclick="sortTable('model')" style="cursor: pointer;">Model % <span id="sort-model">▼</span></th>
                        <th class="center sortable" onclick="sortTable('edge')" style="cursor: pointer;">Edge <span id="sort-edge"></span></th>
                        <th class="center sortable" onclick="sortTable('action')" style="cursor: pointer;">Action <span id="sort-action"></span></th>
                    </tr>
                </thead>
                <tbody id="playerRows">
                </tbody>
            </table>
        </div>
    </div>
    
    <button class="refresh-btn" onclick="loadData()">🔄 Refresh</button>
    
    <script>
        let allPlayers = [];
        let currentSort = { column: 'edge', direction: 'desc' };
        
        function sortTable(column) {
            // Toggle direction if clicking same column
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'desc' ? 'asc' : 'desc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'desc';
            }
            
            // Update sort indicators
            document.querySelectorAll('[id^="sort-"]').forEach(el => el.textContent = '');
            document.getElementById(`sort-${column}`).textContent = currentSort.direction === 'desc' ? '▼' : '▲';
            
            // Sort the players array
            allPlayers.sort((a, b) => {
                let aVal, bVal;
                
                if (column === 'model') {
                    aVal = a.model_probability || -1;
                    bVal = b.model_probability || -1;
                } else if (column === 'edge') {
                    aVal = a.edge || -999;
                    bVal = b.edge || -999;
                } else if (column === 'action') {
                    // Sort by edge for action (BET > WATCH > PASS)
                    aVal = a.edge || -999;
                    bVal = b.edge || -999;
                }
                
                return currentSort.direction === 'desc' ? bVal - aVal : aVal - bVal;
            });
            
            // Re-render the table
            renderTable();
        }
        
        function renderTable() {
            const tbody = document.getElementById('playerRows');
            tbody.innerHTML = '';
            
            allPlayers.forEach(player => {
                const row = document.createElement('tr');
                
                const impliedProb = player.implied_probability || 0;
                const modelProb = player.model_probability;
                const edge = player.edge;
                
                // Determine odds coloring
                let oddsClass = '';
                if (player.bestOdds > 0) {
                    if (player.bestOdds >= 300) oddsClass = 'odds-long';
                    else if (player.bestOdds >= 150) oddsClass = 'odds-medium';
                    else oddsClass = 'odds-short';
                }
                
                // Implied prob coloring
                let impliedProbClass = '';
                if (impliedProb >= 0.4) impliedProbClass = 'prob-high';
                else if (impliedProb >= 0.2) impliedProbClass = 'prob-medium';
                else impliedProbClass = 'prob-low';
                
                // Determine action
                let action = 'PASS';
                let actionClass = 'action-pass';
                if (edge !== null && modelProb !== null) {
                    if (edge > 0.05) {
                        action = '🔥 BET';
                        actionClass = 'action-bet';
                    } else if (edge > 0) {
                        action = '👀 WATCH';
                        actionClass = 'action-watch';
                    }
                }
                
                // Format edge display
                let edgeDisplay = '-';
                let edgeClass = '';
                if (edge !== null) {
                    const edgePct = (edge * 100).toFixed(1);
                    edgeDisplay = `${edge > 0 ? '+' : ''}${edgePct}%`;
                    edgeClass = edge > 0.05 ? 'prob-high' : edge > 0 ? 'prob-medium' : 'prob-low';
                }
                
                row.innerHTML = `
                    <td>
                        <div class="player-name">${player.name}</div>
                    </td>
                    <td>
                        <div class="game-info">${player.game}</div>
                        <div class="game-info">${player.weekday || ''}, ${player.gameday || ''} ${player.gametime || ''}</div>
                    </td>
                    <td class="center">
                        <span class="${oddsClass}">${player.bestOdds > 0 ? '+' : ''}${player.bestOdds}</span>
                    </td>
                    <td class="center">
                        <span class="books-badge">${player.books_count} books</span>
                    </td>
                    <td class="center">
                        <span class="${impliedProbClass}">${(impliedProb * 100).toFixed(1)}%</span>
                    </td>
                    <td class="center">
                        <span class="${modelProb !== null ? 'prob-high' : ''}">${modelProb !== null ? (modelProb * 100).toFixed(1) + '%' : '-'}</span>
                    </td>
                    <td class="center">
                        <span class="${edgeClass}">${edgeDisplay}</span>
                    </td>
                    <td class="center">
                        <span class="${actionClass}">${action}</span>
                    </td>
                `;
                
                tbody.appendChild(row);
            });
        }
        
        async function loadData() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const tableContainer = document.getElementById('tableContainer');
            const stats = document.getElementById('stats');

                    const impliedProb = player.implied_probability || 0;
                    const modelProb = player.model_probability;
                    const edge = player.edge;
                    
                    const impliedProbClass = impliedProb >= 0.6 ? 'prob-high' : impliedProb >= 0.4 ? 'prob-medium' : 'prob-low';
                    const oddsClass = player.bestOdds < 0 ? 'odds-good' : 'odds-bad';
                    
                    let action = '';
                    let actionClass = '';
                    if (edge !== null) {
                        if (edge > 0.05) {
                            action = '🔥 BET';
                            actionClass = 'action-bet';
                        } else if (edge > 0) {
                            action = '👀 WATCH';
                            actionClass = 'action-watch';
                        } else {
                            action = 'PASS';
                            actionClass = 'action-pass';
                        }
                    } else {
                        // Fall back to implied prob if no model
                        if (impliedProb >= 0.6) {
                            action = '👀 WATCH';
                            actionClass = 'action-watch';
                        } else {
                            action = 'PASS';
                            actionClass = 'action-pass';
                        }
                    }
                    
                    // Format edge display
                    let edgeDisplay = '-';
                    let edgeClass = '';
                    if (edge !== null) {
                        const edgePct = (edge * 100).toFixed(1);
                        edgeDisplay = `${edge > 0 ? '+' : ''}${edgePct}%`;
                        edgeClass = edge > 0.05 ? 'prob-high' : edge > 0 ? 'prob-medium' : 'prob-low';
                    }
                    
                    row.innerHTML = `
                        <td>
                            <div class="player-name">${player.name}</div>
                        </td>
                        <td>
                            <div class="game-info">${player.game}</div>
                            <div class="game-info">${player.weekday || ''}, ${player.gameday || ''} ${player.gametime || ''}</div>
                        </td>
                        <td class="center">
                            <span class="${oddsClass}">${player.bestOdds > 0 ? '+' : ''}${player.bestOdds}</span>
                        </td>
                        <td class="center">
                            <span class="books-badge">${player.books_count} books</span>
                        </td>
                        <td class="center">
                            <span class="${impliedProbClass}">${(impliedProb * 100).toFixed(1)}%</span>
                        </td>
                        <td class="center">
                            <span class="${modelProb !== null ? 'prob-high' : ''}">${modelProb !== null ? (modelProb * 100).toFixed(1) + '%' : '-'}</span>
                        </td>
                        <td class="center">
                            <span class="${edgeClass}">${edgeDisplay}</span>
                        </td>
                        <td class="center">
                            <span class="${actionClass}">${action}</span>
                        </td>
                    `;
                    
                    tbody.appendChild(row);
                });
                
                loading.style.display = 'none';
                tableContainer.style.display = 'block';
                stats.style.display = 'flex';
                
            } catch (err) {
                console.error('❌ Error:', err);
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = `Error loading odds: ${err.message}. Click refresh to try again.`;
            }
        }
        
        // Load on page load
        loadData();
        
        // Auto-refresh every 5 minutes
        setInterval(loadData, 5 * 60 * 1000);
    </script>
</body>
</html>
