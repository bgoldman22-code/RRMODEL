<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Player Props Elite Predictions</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid rgba(0, 255, 136, 0.2);
        }

        h1 {
            font-size: 3em;
            background: linear-gradient(135deg, #00ff88 0%, #00d4aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #888;
            font-size: 1.1em;
        }

        .stats-banner {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(0, 255, 136, 0.1);
        }

        .stat-label {
            color: #888;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #00ff88;
        }

        .loading {
            text-align: center;
            padding: 60px;
            font-size: 1.5em;
            color: #888;
        }

        .loading:after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .error {
            background: #ff4444;
            color: white;
            padding: 30px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: center;
        }

        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
            border-left: 4px solid #00ff88;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .game-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 255, 136, 0.2);
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .matchup {
            font-size: 1.5em;
            font-weight: bold;
        }

        .game-time {
            color: #888;
            font-size: 0.9em;
        }

        .predictions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .prediction-card {
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 136, 0.15);
        }

        .player-name {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 15px;
            color: #00ff88;
        }

        .prop-type {
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88;
            padding: 6px 12px;
            border-radius: 6px;
            display: inline-block;
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
        }

        .prediction-details {
            display: grid;
            gap: 12px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .detail-label {
            color: #888;
            font-size: 0.9em;
        }

        .detail-value {
            font-weight: 600;
            color: #fff;
        }

        .prediction-value {
            font-size: 1.8em !important;
            color: #00ff88 !important;
        }

        .recommendation {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 600;
            text-align: center;
        }

        .recommendation.bet {
            background: rgba(0, 255, 136, 0.15);
            border: 2px solid #00ff88;
            color: #00ff88;
        }

        .recommendation.skip {
            background: rgba(255, 68, 68, 0.15);
            border: 2px solid #ff4444;
            color: #ff4444;
        }

        .edge-indicator {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            margin-left: 8px;
        }

        .edge-high {
            background: #00ff88;
            color: #0a0e27;
        }

        .edge-medium {
            background: #ffa500;
            color: #0a0e27;
        }

        .edge-low {
            background: #ff4444;
            color: #fff;
        }

        .opponent-defense-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            margin-top: 8px;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .no-picks {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            font-size: 1.2em;
        }

        .refresh-button {
            background: linear-gradient(135deg, #00ff88 0%, #00d4aa 100%);
            color: #0a0e27;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 20px auto;
            display: block;
        }

        .refresh-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 255, 136, 0.4);
        }

        .last-updated {
            text-align: center;
            color: #888;
            font-size: 0.9em;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏀 NBA Player Props Elite</h1>
            <p class="subtitle">AI-Powered Predictions with Real-Time Opponent Defense Adjustments</p>
        </header>

        <div id="stats-banner" class="stats-banner" style="display: none;">
            <div class="stat-card">
                <div class="stat-label">Total Picks</div>
                <div class="stat-value" id="stat-total">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Confidence</div>
                <div class="stat-value" id="stat-confidence">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Avg Edge</div>
                <div class="stat-value" id="stat-edge">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Games Today</div>
                <div class="stat-value" id="stat-games">0</div>
            </div>
        </div>

        <div id="loading" class="loading">Loading predictions</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="predictions"></div>
        
        <button class="refresh-button" onclick="loadPredictions()" style="display: none;" id="refresh-btn">
            🔄 Refresh Predictions
        </button>
        
        <div class="last-updated" id="last-updated"></div>
    </div>

    <script>
        // Version: 2025-11-13-v2 - Fixed string-to-number parsing
        async function loadPredictions() {
            const loading = document.getElementById('loading');
            const error = document.getElementById('error');
            const predictions = document.getElementById('predictions');
            const statsBanner = document.getElementById('stats-banner');
            const refreshBtn = document.getElementById('refresh-btn');

            loading.style.display = 'block';
            error.style.display = 'none';
            predictions.innerHTML = '';
            statsBanner.style.display = 'none';

            try {
                const response = await fetch('/.netlify/functions/nba-predictions-simple');
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                loading.style.display = 'none';
                refreshBtn.style.display = 'block';

                if (!data.recommendations || data.recommendations.length === 0) {
                    predictions.innerHTML = '<div class="no-picks">No picks available at this time. Check back closer to game time!</div>';
                    return;
                }

                // Display stats
                displayStats(data);
                statsBanner.style.display = 'grid';

                // Group by game
                const gamesByMatchup = {};
                data.recommendations.forEach(rec => {
                    const key = `${rec.homeTeam} vs ${rec.awayTeam}`;
                    if (!gamesByMatchup[key]) {
                        gamesByMatchup[key] = {
                            homeTeam: rec.homeTeam,
                            awayTeam: rec.awayTeam,
                            gameTime: rec.gameTime,
                            predictions: []
                        };
                    }
                    gamesByMatchup[key].predictions.push(rec);
                });

                // Render games
                Object.values(gamesByMatchup).forEach(game => {
                    predictions.appendChild(createGameCard(game));
                });

                // Update timestamp
                const lastUpdated = document.getElementById('last-updated');
                lastUpdated.textContent = `Last updated: ${new Date().toLocaleString()}`;

            } catch (err) {
                loading.style.display = 'none';
                error.style.display = 'block';
                error.textContent = `Error loading predictions: ${err.message}`;
                console.error('Error:', err);
            }
        }

        function displayStats(data) {
            const total = data.recommendations.length;
            const avgConfidence = (data.recommendations.reduce((sum, r) => sum + parseFloat(r.confidence || 0), 0) / total).toFixed(1);
            const avgEdge = (data.recommendations.reduce((sum, r) => sum + parseFloat(r.edge || 0), 0) / total).toFixed(1);
            const games = new Set(data.recommendations.map(r => `${r.homeTeam}-${r.awayTeam}`)).size;

            document.getElementById('stat-total').textContent = total;
            document.getElementById('stat-confidence').textContent = avgConfidence + '%';
            document.getElementById('stat-edge').textContent = avgEdge + '%';
            document.getElementById('stat-games').textContent = games;
        }

        function createGameCard(game) {
            const card = document.createElement('div');
            card.className = 'game-card';

            const header = `
                <div class="game-header">
                    <div class="matchup">${game.awayTeam} @ ${game.homeTeam}</div>
                    <div class="game-time">${formatGameTime(game.gameTime)}</div>
                </div>
            `;

            const predictionsHtml = game.predictions.map(pred => createPredictionCard(pred)).join('');

            card.innerHTML = header + `<div class="predictions-grid">${predictionsHtml}</div>`;
            return card;
        }

        function createPredictionCard(pred) {
            // Convert string values to numbers
            const line = parseFloat(pred.line);
            const predicted = parseFloat(pred.predicted);
            const edge = parseFloat(pred.edge);
            const confidence = parseFloat(pred.confidence);
            
            const edgeClass = edge >= 6 ? 'edge-high' : edge >= 4 ? 'edge-medium' : 'edge-low';
            const recClass = pred.recommendation === 'BET' ? 'bet' : 'skip';
            
            return `
                <div class="prediction-card">
                    <div class="player-name">${pred.player}</div>
                    <div class="prop-type">${pred.propType || pred.prop || pred.market}</div>
                    
                    <div class="prediction-details">
                        <div class="detail-row">
                            <span class="detail-label">Prediction</span>
                            <span class="detail-value prediction-value">${predicted.toFixed(1)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Line</span>
                            <span class="detail-value">${line.toFixed(1)}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Edge</span>
                            <span class="detail-value">
                                ${edge.toFixed(1)}%
                                <span class="edge-indicator ${edgeClass}">
                                    ${edge >= 6 ? 'HIGH' : edge >= 4 ? 'MED' : 'LOW'}
                                </span>
                            </span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Confidence</span>
                            <span class="detail-value">${confidence.toFixed(1)}%</span>
                        </div>
                        ${pred.oppDefenseRating ? `
                        <div class="detail-row">
                            <span class="detail-label">Opponent Defense</span>
                            <span class="detail-value">
                                ${parseFloat(pred.oppDefenseRating).toFixed(1)} pts/100
                                <div class="opponent-defense-badge">
                                    ${pred.oppDefenseRating < 108 ? '🛡️ Elite' : 
                                      pred.oppDefenseRating > 115 ? '🚨 Weak' : '⚖️ Average'}
                                </div>
                            </span>
                        </div>
                        ` : ''}
                    </div>
                    
                    <div class="recommendation ${recClass}">
                        ${pred.recommendation === 'BET' ? 
                            `✅ PICK: ${pred.side || pred.pick || 'OVER'} ${line.toFixed(1)}` : 
                            `⛔ SKIP - Edge Too Low`
                        }
                    </div>
                </div>
            `;
        }

        function formatGameTime(timeStr) {
            if (!timeStr) return 'TBD';
            try {
                const date = new Date(timeStr);
                return date.toLocaleString('en-US', {
                    weekday: 'short',
                    month: 'short',
                    day: 'numeric',
                    hour: 'numeric',
                    minute: '2-digit',
                    hour12: true
                });
            } catch {
                return timeStr;
            }
        }

        // Load predictions on page load
        loadPredictions();

        // Auto-refresh every 5 minutes
        setInterval(loadPredictions, 5 * 60 * 1000);
    </script>
</body>
</html>
