<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFL Predictions</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900">
  <header class="border-b bg-white">
    <div class="mx-auto max-w-6xl px-4 py-4 flex items-center justify-between">
      <h1 class="text-xl font-bold">NFL Predictions</h1>
      <nav class="text-sm space-x-4">
        <a href="/" class="hover:underline">Home</a>
        <a href="/predictions.html" class="font-semibold underline">Predictions</a>
      </nav>
    </div>
  </header>

  <main class="mx-auto max-w-6xl px-4 py-6">
    <section class="mb-8">
      <div id="meta" class="text-sm text-gray-600"></div>
    </section>

    <section class="mb-10">
      <h2 class="text-lg font-semibold mb-3">This Week's Games</h2>
      <div class="overflow-x-auto rounded-xl border bg-white">
        <table class="min-w-full text-sm">
          <thead class="bg-gray-100 text-gray-700">
            <tr>
              <th class="px-3 py-2 text-left">Game</th>
              <th class="px-3 py-2 text-left">Kickoff (UTC)</th>
              <th class="px-3 py-2 text-left">Home Win %</th>
              <th class="px-3 py-2 text-left">Proj Margin (home)</th>
              <th class="px-3 py-2 text-left">Proj Total</th>
              <th class="px-3 py-2 text-left">Weather</th>
              <th class="px-3 py-2 text-left">Injuries</th>
            </tr>
          </thead>
          <tbody id="games"></tbody>
        </table>
      </div>
    </section>

    <section>
      <h2 class="text-lg font-semibold mb-3">Parlay Suggestions (auto-built)</h2>
      <div class="grid md:grid-cols-2 gap-6">
        <div class="rounded-xl border bg-white p-4">
          <h3 class="font-semibold mb-2">3-Leg</h3>
          <ul id="legs3" class="list-disc pl-5 text-sm"></ul>
        </div>
        <div class="rounded-xl border bg-white p-4">
          <h3 class="font-semibold mb-2">5-Leg</h3>
          <ul id="legs5" class="list-disc pl-5 text-sm"></ul>
        </div>
      </div>
    </section>
  </main>

  <script>
    (async () => {
      const u = "/.netlify/functions/nfl-predictions-get?season=2025&week=2";
      const res = await fetch(u);
      const data = await res.json();
      if (!data?.ok) {
        document.getElementById("meta").textContent = "No predictions found.";
        return;
      }
      const { season, week, BUNDLE_VERSION, source, games, parlays } = data;
      document.getElementById("meta").textContent = `Season ${season} • Week ${week} • Source: ${source} • Bundle: ${BUNDLE_VERSION}`;

      const tbody = document.getElementById("games");
      games.forEach(g => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="px-3 py-2 font-medium">${g.away} @ ${g.home}</td>
          <td class="px-3 py-2">${g.start_iso || ""}</td>
          <td class="px-3 py-2">${(Number(g.win_prob_home)*100).toFixed(1)}%</td>
          <td class="px-3 py-2">${g.proj_margin_home?.toFixed?.(1) ?? ""}</td>
          <td class="px-3 py-2">${g.proj_total?.toFixed?.(1) ?? ""}</td>
          <td class="px-3 py-2 text-xs">${g.weather ? `${g.weather.temp_f}F, wind ${g.weather.wind_mph} mph, precip ${Math.round((g.weather.precip||0)*100)}%` : ""}</td>
          <td class="px-3 py-2 text-xs">${g.injury_notes ? JSON.stringify(g.injury_notes) : ""}</td>
        `;
        tbody.appendChild(tr);
      });

      const ul3 = document.getElementById("legs3");
      const ul5 = document.getElementById("legs5");
      (parlays?.legs3 || []).forEach(l => {
        const li = document.createElement("li");
        li.textContent = `${l.team} ML (p≈${Math.round(l.prob*100)}%) — ${l.game_id}`;
        ul3.appendChild(li);
      });
      (parlays?.legs5 || []).forEach(l => {
        const li = document.createElement("li");
        li.textContent = `${l.team} ML (p≈${Math.round(l.prob*100)}%) — ${l.game_id}`;
        ul5.appendChild(li);
      });
    })();
  </script>
</body>
</html>
