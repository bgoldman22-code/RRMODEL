[build]
  functions = "netlify/functions"
  publish   = "dist"

[functions]
  node_bundler = "esbuild"

[build.environment]
  BLOBS_STORE_NFL        = "nfl-td"
  NFL_SCHEDULE_URL       = "nfl-schedule-get"
  NFL_ODDS_BRIDGE_URL    = "odds-get"
  NFLVERSE_TEAM_FORM_URL = "/nflverse-team-form.json"
  NODE_VERSION           = "20"

# --- Blobs bindings (bind the nfl-td Blob store to your functions) ---
[[functions.blobs]]
  function = "odds-refresh"
  name     = "nfl-td"

[[functions.blobs]]
  function = "nfl-predictions-generate"
  name     = "nfl-td"

[[functions.blobs]]
  function = "odds-status"
  name     = "nfl-td"
