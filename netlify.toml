[build]
  command = "bash netlify/build-debug.sh"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # IMPORTANT: do not list @netlify/blobs here while testing
  external_node_modules = ["csv-parse"]
  included_files = ["netlify/functions/_data/**"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions."nfl-predictions-train"]
  included_files = ["netlify/functions/nfl-predictions-train/**"]
  schedule = "0 10 * * 2" # every Tuesday 10am ET

[functions."nfl-predictions-score"]
  included_files = ["netlify/functions/nfl-predictions-score/**"]

[build.environment]
  TRAIN_SECRET = "bgroundrobin_train_secret_25c7e8b0c9" # random strong token
