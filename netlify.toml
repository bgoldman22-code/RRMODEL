# netlify.toml (schedule refresh + blobs)
[build]
  command = "bash netlify/build-debug.sh"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]
  included_files = [
    "netlify/functions/**/_data/**",
    "netlify/data/**"
  ]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
