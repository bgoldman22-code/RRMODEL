# netlify.toml

[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

[build.processing.secrets]
  # Documentation files contain placeholder references, not actual secrets
  omit_paths = ["ACTION_REQUIRED.md", "GITHUB_ACTION_RAPIDAPI_SETUP.md", "RAPIDAPI_INTEGRATION_SUMMARY.md"]

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "node-fetch"]
  included_files = ["public/**"]

# Phase 1 Speed Optimization: Slim bundles per function
[functions."nfl-predictions-get"]
  external_node_modules = ["@netlify/blobs"]
  included_files = []  # GET needs no data files, only reads from blobs

[functions."nfl-predictions-generate"]
  included_files = ["data/nfl/**", "netlify/functions/_lib/nfl-*.mjs", "netlify/functions/_lib/*-nfl.js", "netlify/functions/_lib/*-nfl.mjs"]
  external_node_modules = ["@netlify/blobs", "node-fetch"]

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_USE_YARN = "false"
  NPM_FLAGS = "--legacy-peer-deps"
  BLOBS_STORE_NFL = "nfl-td"
  NFL_SCHEDULE_URL = "nfl-schedule-get"
  NFL_ODDS_BRIDGE_URL = "odds-get"
  NFLVERSE_TEAM_FORM_URL = "/nflverse-team-form.json"

# Background injury analysis - runs every 30 minutes
[[scheduled.functions]]
  name = "injuries-cron-all"
  cron = "*/30 * * * *"

# Intensive injury refresh during prime time (Thu-Mon nights, 10pm-3am)
[[scheduled.functions]]
  name = "injuries-cron-primetime"
  cron = "*/10 22-23,0-3 * * 0,4-6"

# TD Player Props Odds Cache - refresh daily at 8am ET (12pm UTC)
[[scheduled.functions]]
  name = "refresh-td-odds-cache"
  cron = "0 12 * * *"

# NFL Predictions Cache - refresh every 30 minutes during game weeks (Tue-Mon)
[[scheduled.functions]]
  name = "nfl-predictions-refresh"
  cron = "*/30 * * * *"

# NFL Odds Snapshots - capture every 5 minutes for line movement tracking
[[scheduled.functions]]
  name = "nfl-odds-snapshot"
  cron = "*/5 * * * *"
