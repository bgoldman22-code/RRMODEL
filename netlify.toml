[functions."nhl-sog-scanner-elite-fast"]

[functions."nhl-sog-debug"]  node_bundler = "zisi"

  node_bundler = "zisi"  included_files = ["netlify/functions/_lib/**"]

  included_files = ["netlify/functions/_lib/**"]

[functions."nhl-sog-debug"]

[build.environment]  node_bundler = "zisi"

  NODE_VERSION = "20"  included_files = ["netlify/functions/_lib/**"]

  NETLIFY_USE_YARN = "false"

  NPM_FLAGS = "--legacy-peer-deps"# nfl-receiving-scanner-elite will use global [functions] config

  BLOBS_STORE_NFL = "nfl-td"

  NFL_SCHEDULE_URL = "nfl-schedule-get"[build.environment]

  NFL_ODDS_BRIDGE_URL = "odds-get"  NODE_VERSION = "20"

  NFLVERSE_TEAM_FORM_URL = "/nflverse-team-form.json"  NETLIFY_USE_YARN = "false"

  NPM_FLAGS = "--legacy-peer-deps"

[[scheduled.functions]]  BLOBS_STORE_NFL = "nfl-td"

  name = "injuries-cron-all"  NFL_SCHEDULE_URL = "nfl-schedule-get"

  cron = "*/30 * * * *"  NFL_ODDS_BRIDGE_URL = "odds-get"

  NFLVERSE_TEAM_FORM_URL = "/nflverse-team-form.json"

[[scheduled.functions]]

  name = "injuries-cron-primetime"# Background injury analysis - runs every 30 minutes

  cron = "*/10 22-23,0-3 * * 0,4-6"[[scheduled.functions]]

  name = "injuries-cron-all"

[[scheduled.functions]]  cron = "*/30 * * * *"

  name = "refresh-td-odds-cache"

  cron = "0 12 * * *"# Intensive injury refresh during prime time (Thu-Mon nights, 10pm-3am)

[[scheduled.functions]]

[[scheduled.functions]]  name = "injuries-cron-primetime"

  name = "nfl-predictions-refresh"  cron = "*/10 22-23,0-3 * * 0,4-6"

  cron = "*/30 * * * *"

# TD Player Props Odds Cache - refresh daily at 8am ET (12pm UTC)

[[scheduled.functions]][[scheduled.functions]]

  name = "nfl-odds-snapshot"  name = "refresh-td-odds-cache"

  cron = "*/5 * * * *"  cron = "0 12 * * *"



[[scheduled.functions]]# NFL Predictions Cache - refresh every 30 minutes during game weeks (Tue-Mon)

  name = "nhl-stats-refresh"[[scheduled.functions]]

  cron = "0 14 * * *"  name = "nfl-predictions-refresh"

  cron = "*/30 * * * *"

[functions."nhl-stats-refresh"]

  included_files = []# NFL Odds Snapshots - capture every 5 minutes for line movement tracking

  external_node_modules = ["@netlify/blobs"][[scheduled.functions]]

  name = "nfl-odds-snapshot"
  cron = "*/5 * * * *"

# NHL Stats Refresh - populate Netlify Blobs with player/team stats daily at 10am ET (14:00 UTC)
[[scheduled.functions]]
  name = "nhl-stats-refresh"
  cron = "0 14 * * *"

# NHL Stats Refresh configuration - allow longer execution time
[functions."nhl-stats-refresh"]
  included_files = []
  external_node_modules = ["@netlify/blobs"]
