# netlify.toml - NBA V2 Configuration

[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

[build.processing.secrets]
  # Documentation files contain placeholder references, not actual secrets
  omit_paths = ["ACTION_REQUIRED.md", "GITHUB_ACTION_RAPIDAPI_SETUP.md", "RAPIDAPI_INTEGRATION_SUMMARY.md"]

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "node-fetch"]
  included_files = ["public/**", "data/nba/**", "data/nfl/ssot/**", "netlify/functions/_lib/**"]

# Phase 1 Speed Optimization: Slim bundles per function
[functions."nfl-predictions-get"]
  external_node_modules = ["@netlify/blobs"]
  included_files = []  # GET needs no data files, only reads from blobs

[functions."nfl-predictions-generate"]
  included_files = ["data/nfl/**", "public/history/**", "netlify/functions/_lib/nfl-*.mjs", "netlify/functions/_lib/*-nfl.js", "netlify/functions/_lib/*-nfl.mjs", "netlify/functions/_lib/csv-snapshot.mjs", "netlify/functions/_lib/depth-chart-change-detector.js"]
  external_node_modules = ["@netlify/blobs", "node-fetch"]

[functions."nba-predictions-simple"]
  included_files = ["data/nba/**", "netlify/functions/_lib/nba/**"]
  external_node_modules = []

[functions."nba-predictions-elite"]
  included_files = ["data/nba/**", "netlify/functions/_lib/nba/**"]
  external_node_modules = ["@netlify/blobs", "node-fetch"]

[functions."nba-predictions-elite-v2"]
  included_files = ["data/nba/**", "netlify/functions/_lib/nba/**"]
  external_node_modules = ["@netlify/blobs", "node-fetch"]

[functions."nba-predictions-generate"]
  included_files = ["data/nba/**", "netlify/functions/_lib/nba/**"]
  external_node_modules = ["@netlify/blobs", "node-fetch"]

# NHL SOG Scanner - disable bundling completely to preserve ES modules
[functions."nhl-sog-scanner-elite-fast"]
  node_bundler = "zisi"
  included_files = ["netlify/functions/_lib/**"]

[functions."nhl-sog-debug"]
  node_bundler = "zisi"
  included_files = ["netlify/functions/_lib/**"]

# nfl-receiving-scanner-elite will use global [functions] config

# nfl-anytime-td-candidates - proxy to comprehensive with transformation
[functions."nfl-anytime-td-candidates"]
  node_bundler = "esbuild"
  included_files = ["public/**", "data/nfl/**", "netlify/functions/nfl-td-comprehensive-predictions/**"]
  external_node_modules = ["@netlify/blobs", "node-fetch"]

# nfl-td-comprehensive-predictions - core TD engine
[functions."nfl-td-comprehensive-predictions"]
  node_bundler = "esbuild"
  included_files = ["public/**", "data/nfl/**", "scripts/fetch-player-prop-odds.js"]
  external_node_modules = ["@netlify/blobs", "node-fetch"]

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_USE_YARN = "false"
  NPM_FLAGS = "--legacy-peer-deps"
  BLOBS_STORE_NFL = "nfl-td"
  NFL_SCHEDULE_URL = "nfl-schedule-get"
  NFL_ODDS_BRIDGE_URL = "odds-get"
  NFLVERSE_TEAM_FORM_URL = "/nflverse-team-form.json"

# Background injury analysis - runs every 30 minutes
[[scheduled.functions]]
  name = "injuries-cron-all"
  cron = "*/30 * * * *"

# Intensive injury refresh during prime time (Thu-Mon nights, 10pm-3am)
[[scheduled.functions]]
  name = "injuries-cron-primetime"
  cron = "*/10 22-23,0-3 * * 0,4-6"

# TD Player Props Odds Cache - refresh daily at 8am ET (12pm UTC)
[[scheduled.functions]]
  name = "refresh-td-odds-cache"
  cron = "0 12 * * *"

# NFL Predictions Cache - refresh every 30 minutes during game weeks (Tue-Mon)
[[scheduled.functions]]
  name = "nfl-predictions-refresh"
  cron = "*/30 * * * *"

# NFL Odds Snapshots - capture every 5 minutes for line movement tracking
[[scheduled.functions]]
  name = "nfl-odds-snapshot"
  cron = "*/5 * * * *"

# NHL Stats Refresh - populate Netlify Blobs with player/team stats daily at 10am ET (14:00 UTC)
[[scheduled.functions]]
  name = "nhl-stats-refresh"
  cron = "0 14 * * *"

# NHL Stats Refresh configuration - allow longer execution time
[functions."nhl-stats-refresh"]
  included_files = []
  external_node_modules = ["@netlify/blobs"]
