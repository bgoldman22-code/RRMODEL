# netlify.toml - patched to include function data files
[build]
  command = "bash netlify/build-debug.sh"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]
  included_files = ["netlify/functions/**/_data/**"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
