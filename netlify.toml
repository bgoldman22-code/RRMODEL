[build]
  command = "bash netlify/build-debug.sh"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # IMPORTANT: do not list @netlify/blobs here while testing
  external_node_modules = ["csv-parse"]
  included_files = ["netlify/functions/_data/**"]

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
