## netlify.toml
## NOTE: TOML does not allow duplicate tables like multiple [build] blocks.
## Keep everything consolidated here.

[build]
  command = "pip install -r ml/requirements.txt && npm run build"
  functions = "netlify/functions"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "node-fetch"]
  # Removed bloated included_files - functions should only include what they specifically need
  # Individual functions can declare their own included_files if required

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_USE_YARN = "false"
  NPM_FLAGS = "--legacy-peer-deps"
  BLOBS_STORE_NFL = "nfl-td"
  NFL_SCHEDULE_URL = "nfl-schedule-get"
  NFL_ODDS_BRIDGE_URL = "odds-get"
  NFLVERSE_TEAM_FORM_URL = "/nflverse-team-form.json"
  # Keep secrets scanning enabled, but omit generated/build output that often contains
  # high-entropy strings and vendored content which can trigger false positives.
  SECRETS_SCAN_OMIT_PATHS = "dist/**,.netlify/**,node_modules/**,.venv/**,temp_fpl_data/**"

# Background injury analysis - runs every 30 minutes
[[scheduled.functions]]
  name = "injuries-cron-all"
  cron = "*/30 * * * *"

# Intensive injury refresh during prime time (Thu-Mon nights, 10pm-3am)
[[scheduled.functions]]
  name = "injuries-cron-primetime"
  cron = "*/10 22-23,0-3 * * 0,4-6"

# TD Player Props Odds Cache - refresh daily at 8am ET (12pm UTC)
[[scheduled.functions]]
  name = "refresh-td-odds-cache"
  cron = "0 12 * * *"

# NFL V5 Predictions - refresh weekly on Tuesday 10am ET (14:00 UTC)
[[scheduled.functions]]
  name = "nfl-v5-weekly-refresh"
  cron = "0 14 * * 2"

# 🆕 NBA Tracking - Verify game results daily at 6 AM ET (11:00 UTC)
[[scheduled.functions]]
  name = "nba-tracking-verify-games"
  cron = "0 11 * * *"

# 🆕 NBA Tracking - Verify player props daily at 6 AM ET (11:00 UTC)
[[scheduled.functions]]
  name = "nba-tracking-verify-props"
  cron = "0 11 * * *"

# 🆕 NBA Boxscores - Update daily at 5 AM ET (10:00 UTC) to keep roster data fresh
[[scheduled.functions]]
  name = "update-boxscores-daily"
  cron = "0 10 * * *"

# 🔥 NBA Player Props Predictions - Generate daily at 7 AM ET (11:00 UTC)
[[scheduled.functions]]
  name = "generate-daily-predictions"
  cron = "0 11 * * *"

# 🏀 NBA Aggregator — Save all picks daily at noon ET (17:00 UTC)
[[scheduled.functions]]
  name = "nba-aggregator-save-daily"
  cron = "0 17 * * *"

# ⚽ Bundesliga BTTS Function - include cache file
[functions."bundesliga-btts-predict"]
  included_files = ["data/bundesliga/cache/bundesliga_btts_latest.json"]
