# netlify.toml# netlify.toml - NBA V2 Configuration



[build][build]

  command = "npm run build"  command = "npm run build"

  functions = "netlify/functions"  functions = "netlify/functions"

  publish = "dist"  publish = "dist"

  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."



[build.processing.secrets][build.processing.secrets]

  omit_paths = ["ACTION_REQUIRED.md", "GITHUB_ACTION_RAPIDAPI_SETUP.md", "RAPIDAPI_INTEGRATION_SUMMARY.md"]  # Documentation files contain placeholder references, not actual secrets

  omit_paths = ["ACTION_REQUIRED.md", "GITHUB_ACTION_RAPIDAPI_SETUP.md", "RAPIDAPI_INTEGRATION_SUMMARY.md"]

[functions]

  node_bundler = "esbuild"[functions]

  node_module_format = "esm"  node_bundler = "esbuild"

  external_node_modules = ["@netlify/blobs", "node-fetch"]  node_module_format = "esm"

  included_files = ["public/**", "data/nba/**", "data/nfl/ssot/**", "netlify/functions/_lib/**"]  external_node_modules = ["@netlify/blobs", "node-fetch"]

  included_files = ["public/**", "data/nba/**", "data/nfl/ssot/**", "netlify/functions/_lib/**"]

[functions."nfl-predictions-get"]

  external_node_modules = ["@netlify/blobs"]# Phase 1 Speed Optimization: Slim bundles per function

  included_files = [][functions."nfl-predictions-get"]

  external_node_modules = ["@netlify/blobs"]

[functions."nfl-predictions-generate"]  included_files = []  # GET needs no data files, only reads from blobs

  included_files = ["data/nfl/**", "public/history/**", "netlify/functions/_lib/nfl-*.mjs", "netlify/functions/_lib/*-nfl.js", "netlify/functions/_lib/*-nfl.mjs", "netlify/functions/_lib/csv-snapshot.mjs", "netlify/functions/_lib/depth-chart-change-detector.js"]

  external_node_modules = ["@netlify/blobs", "node-fetch"][functions."nfl-predictions-generate"]

  included_files = ["data/nfl/**", "public/history/**", "netlify/functions/_lib/nfl-*.mjs", "netlify/functions/_lib/*-nfl.js", "netlify/functions/_lib/*-nfl.mjs", "netlify/functions/_lib/csv-snapshot.mjs", "netlify/functions/_lib/depth-chart-change-detector.js"]

