# netlify.toml (patch)
[build]
  command = "bash netlify/build-debug.sh"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

[functions."*"]
  external_node_modules = ["csv-parse","node-fetch"]
  included_files = ["netlify/functions/_data/**"]

[functions."nfl-predictions-generate"]
  included_files = ["netlify/functions/_data/**"]

# Optional redirects for client routes
[[redirects]]
  from = "/predictions"
  to = "/index.html"
  status = 200
