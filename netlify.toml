# netlify.toml
# Force deployment: Elite Injury system restored from working commit fceace4 - Oct 9, 2025

[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF ."

[build.processing.secrets]
  # Documentation files contain placeholder references, not actual secrets
  omit_paths = ["ACTION_REQUIRED.md", "GITHUB_ACTION_RAPIDAPI_SETUP.md", "RAPIDAPI_INTEGRATION_SUMMARY.md"]

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs", "node-fetch"]
  included_files = ["public/**"]

[build.environment]
  NODE_VERSION = "20"
  NETLIFY_USE_YARN = "false"
  NPM_FLAGS = "--legacy-peer-deps"
  BLOBS_STORE_NFL = "nfl-td"
  NFL_SCHEDULE_URL = "nfl-schedule-get"
  NFL_ODDS_BRIDGE_URL = "odds-get"
  NFLVERSE_TEAM_FORM_URL = "/nflverse-team-form.json"

# Background injury analysis - runs every 30 minutes
[[scheduled.functions]]
  name = "injuries-cron-all"
  cron = "*/30 * * * *"

# Intensive injury refresh during prime time (Thu-Mon nights, 10pm-3am)
[[scheduled.functions]]
  name = "injuries-cron-primetime"
  cron = "*/10 22-23,0-3 * * 0,4-6"

# TD Player Props Odds Cache - refresh daily at 8am ET (12pm UTC)
[[scheduled.functions]]
  name = "refresh-td-odds-cache"
  cron = "0 12 * * *"

# ============================================
# DAILY LEARNERS - Continuous Model Improvement
# ============================================

# MLB Daily Learner - runs at 3:05am ET (7:05 UTC) after games complete
# Learns from completed MLB games: pitch types, zones, batter/pitcher patterns
[[scheduled.functions]]
  name = "mlb-daily-learn"
  cron = "5 7 * * *"

# MLB 2+ Hits Learner - runs at 3:10am ET (7:10 UTC)
[[scheduled.functions]]
  name = "hits2-daily-learn"
  cron = "10 7 * * *"

# MLB Stolen Base Learner - runs at 3:15am ET (7:15 UTC)
[[scheduled.functions]]
  name = "sb-daily-learn"
  cron = "15 7 * * *"

# Soccer Daily Learner - runs at 3:20am ET (7:20 UTC)
# Learns from completed soccer matches: goals, BTTS rates, team form
[[scheduled.functions]]
  name = "soccer-daily-learn"
  cron = "20 7 * * *"
