<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Schedule Refresh</title>
  </head>
  <body>
    <h1>Import Full NFL Schedule (JSON)</h1>
    <p>Paste the season JSON ({"season":2025,"weeks":{"1":[...],"2":[...],...}}) and click Import.</p>
    <textarea id="txt" style="width:100%;height:300px"></textarea>
    <div style="margin:12px 0">
      <label>Season: <input id="season" value="2025" /></label>
      <label style="margin-left:12px"><input type="checkbox" id="commit" checked /> Save to Blobs</label>
    </div>
    <button id="btn">Import</button>
    <pre id="out"></pre>
    <script>
      btn.onclick = async () => {
        const season = document.getElementById('season').value || '2025';
        const commit = document.getElementById('commit').checked;
        const body = txt.value;
        try {
          const res = await fetch('/.netlify/functions/nfl-schedule-refresh?season=' + encodeURIComponent(season) + '&commit=' + commit, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body
          });
          const j = await res.json();
          out.textContent = JSON.stringify(j, null, 2);
        } catch (e) {
          out.textContent = String(e);
        }
      };
    </script>
  </body>
</html>
